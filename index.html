<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFC93C" />
    <meta name="description" content="CILUKA — dunia pengembaraan belajar huruf, menulis dan mengeja Bahasa Melayu untuk kanak-kanak 3–6 tahun." />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>CILUKA</title>
    <style>
      html, body { margin: 0; height: 100%; background: #7FD0F6; }
      #splash { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(#7FD0F6, #E9FBFF); font-family: system-ui, sans-serif; color: #3B2A4D; }
      #splash .ball { width: 72px; height: 72px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE27A, #FFC93C 60%, #FF9F6B); animation: b 0.8s ease-in-out infinite alternate; margin: 0 auto 14px; }
      #splash p { font-weight: 800; font-size: 22px; letter-spacing: 1px; margin: 0; text-align: center; }
      @keyframes b { to { transform: translateY(-18px); } }
    </style>
  </head>
  <body>
    <div id="splash" aria-label="Memuatkan CILUKA"><div><div class="ball"></div><p>CILUKA</p></div></div>
    <div id="root"></div>
    <noscript>CILUKA memerlukan JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
